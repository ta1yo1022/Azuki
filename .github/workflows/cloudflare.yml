name: Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Validate Pages metadata functions
        run: npx wrangler pages functions build --outdir "$RUNNER_TEMP/azuki-pages-functions"

  deploy:
    name: Publish to Cloudflare
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://azuki.mame-app.com
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing configuration: $key"
              exit 1
            fi
          done
      - run: npm ci
      - run: npm run build
      - name: Record user data totals before migration
        run: npx wrangler d1 execute azuki-db --remote --config wrangler.api.jsonc --json --command "SELECT (SELECT count(*) FROM decks WHERE owner_id<>'azuki:official') AS decks, (SELECT count(*) FROM words w JOIN decks d ON d.id=w.deck_id WHERE d.owner_id<>'azuki:official') AS words" > "$RUNNER_TEMP/azuki-before.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Apply D1 migrations
        run: npm run db:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify D1 migration preserved user data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute azuki-db --remote --config wrangler.api.jsonc --json --command "SELECT (SELECT count(*) FROM decks WHERE owner_id<>'azuki:official') AS decks, (SELECT count(*) FROM words w JOIN decks d ON d.id=w.deck_id WHERE d.owner_id<>'azuki:official') AS words, (SELECT count(*) FROM decks WHERE owner_id='azuki:official' AND id IN ('azuki-official-daily-v1','azuki-official-travel-v1','azuki-official-food-v1','azuki-official-feelings-v1','azuki-official-work-v1')) AS legacy_originals" > "$RUNNER_TEMP/azuki-after.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = name => JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/azuki-${name}.json`, 'utf8'))[0].results[0];
          const before = read('before'), after = read('after');
          console.log({before, after});
          if (after.legacy_originals !== 0) throw Error('Official D1 migration incomplete');
          if (before.decks !== after.decks || before.words !== after.words) throw Error('User data totals changed; inspect migration and concurrent activity');
          NODE
      - name: Deploy API
        run: npm run deploy:api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.147.0'
          command: pages deploy dist --project-name azuki --branch main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Check published endpoints
        run: |
          curl --fail --retry 3 --retry-all-errors --silent --show-error https://azuki.mame-app.com/ --output /dev/null
          curl --fail --retry 3 --retry-all-errors --silent --show-error https://azuki-api.mizuno-taiyo-sub.workers.dev/api/health --output /dev/null
